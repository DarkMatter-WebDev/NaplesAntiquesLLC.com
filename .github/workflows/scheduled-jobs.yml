# Scheduled jobs — MANUAL runs only.
#
# Supabase pg_cron fires all seven jobs on their schedules
# (supabase/scheduled-jobs-pg-cron-2026-09.sql). This workflow keeps only the
# "Run workflow" button for a manual run of any job.
#
# HISTORY — read before adding a `schedule:` back
# -----------------------------------------------
# - 2026-08-11: this workflow replaced the five Netlify scheduled functions, which
#   had never executed once.
# - 2026-08-27: GitHub `schedule` degraded — it created only 6–16 of ~64 runs a
#   day, often hours late.
# - 2026-09-07: pg_cron took over every trigger; this `schedule:` block and the
#   Netlify functions were kept for a short overlap.
# - 2026-09-11/12: Netlify's scheduler started working, so every job fired THREE
#   times (pg_cron, Netlify ~15–40s later, GitHub late). Found after run #606's
#   facebook-drip 502 (a late GitHub call). The social drips claim nothing
#   before publishing, so overlapping triggers could double-post.
# - 2026-09-13: `schedule:` removed here and next-app/netlify/functions/ deleted.
#   ONE scheduler, pg_cron. Adding a second one brings the double-post risk back.
#
# The routes are trigger-agnostic and guarded by an `x-cron-secret` header.
# Repository secrets (Settings → Secrets and variables → Actions):
#   ETSY_CRON_SECRET, EBAY_CRON_SECRET, INSTAGRAM_CRON_SECRET, FACEBOOK_CRON_SECRET
# Same values as Netlify and Supabase Vault. Each job fails loudly if its secret
# is missing.
#
# ⚠️ The GitHub mobile app labels these runs "Triggered via pull request"; the web
# UI and the API show the real event.

name: Scheduled jobs

on:
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run now
        required: true
        default: all
        type: choice
        options:
          - all
          - etsy-price-push
          - ebay-price-push
          - instagram-drip
          - facebook-drip
          - instagram-token-refresh
          - reconcile-status

# No repository access is needed — these jobs only make an outbound HTTPS call.
permissions: {}

env:
  SITE_URL: https://naplesestatejewelry.com

concurrency:
  group: scheduled-jobs-${{ inputs.job }}
  cancel-in-progress: false

jobs:
  etsy-price-push:
    if: contains(fromJSON('["all","etsy-price-push"]'), inputs.job)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/admin/etsy/price-push
        env:
          ROUTE: /api/admin/etsy/price-push
          SECRET_NAME: ETSY_CRON_SECRET
          CRON_SECRET: ${{ secrets.ETSY_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::${SECRET_NAME} is not set in this repository's Actions secrets."
            exit 1
          fi
          code=$(curl -sS --max-time 120 -o response.json -w '%{http_code}' \
            -X POST "${SITE_URL}${ROUTE}" \
            -H 'content-type: application/json' \
            -H "x-cron-secret: ${CRON_SECRET}")
          echo "HTTP ${code}"
          cat response.json; echo
          [ "${code}" -ge 200 ] && [ "${code}" -lt 300 ]

  ebay-price-push:
    if: contains(fromJSON('["all","ebay-price-push"]'), inputs.job)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/admin/ebay/price-push
        env:
          ROUTE: /api/admin/ebay/price-push
          SECRET_NAME: EBAY_CRON_SECRET
          CRON_SECRET: ${{ secrets.EBAY_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::${SECRET_NAME} is not set in this repository's Actions secrets."
            exit 1
          fi
          code=$(curl -sS --max-time 120 -o response.json -w '%{http_code}' \
            -X POST "${SITE_URL}${ROUTE}" \
            -H 'content-type: application/json' \
            -H "x-cron-secret: ${CRON_SECRET}")
          echo "HTTP ${code}"
          cat response.json; echo
          [ "${code}" -ge 200 ] && [ "${code}" -lt 300 ]

  instagram-drip:
    if: contains(fromJSON('["all","instagram-drip"]'), inputs.job)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/admin/instagram/drip
        env:
          ROUTE: /api/admin/instagram/drip
          SECRET_NAME: INSTAGRAM_CRON_SECRET
          CRON_SECRET: ${{ secrets.INSTAGRAM_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::${SECRET_NAME} is not set in this repository's Actions secrets."
            exit 1
          fi
          code=$(curl -sS --max-time 120 -o response.json -w '%{http_code}' \
            -X POST "${SITE_URL}${ROUTE}" \
            -H 'content-type: application/json' \
            -H "x-cron-secret: ${CRON_SECRET}")
          echo "HTTP ${code}"
          cat response.json; echo
          [ "${code}" -ge 200 ] && [ "${code}" -lt 300 ]

  facebook-drip:
    if: contains(fromJSON('["all","facebook-drip"]'), inputs.job)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/admin/facebook/drip
        env:
          ROUTE: /api/admin/facebook/drip
          SECRET_NAME: FACEBOOK_CRON_SECRET
          CRON_SECRET: ${{ secrets.FACEBOOK_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::${SECRET_NAME} is not set in this repository's Actions secrets."
            exit 1
          fi
          code=$(curl -sS --max-time 120 -o response.json -w '%{http_code}' \
            -X POST "${SITE_URL}${ROUTE}" \
            -H 'content-type: application/json' \
            -H "x-cron-secret: ${CRON_SECRET}")
          echo "HTTP ${code}"
          cat response.json; echo
          [ "${code}" -ge 200 ] && [ "${code}" -lt 300 ]

  # Status-drift reconcile — the safety net under the auto-delist hook, which
  # runs post-response via Next's after() and is best-effort on Netlify. pg_cron
  # runs it every 30 minutes; each channel uses its own existing secret.
  ebay-reconcile-status:
    if: contains(fromJSON('["all","reconcile-status"]'), inputs.job)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/admin/ebay/reconcile-status
        env:
          ROUTE: /api/admin/ebay/reconcile-status
          SECRET_NAME: EBAY_CRON_SECRET
          CRON_SECRET: ${{ secrets.EBAY_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::${SECRET_NAME} is not set in this repository's Actions secrets."
            exit 1
          fi
          code=$(curl -sS --max-time 120 -o response.json -w '%{http_code}' \
            -X POST "${SITE_URL}${ROUTE}" \
            -H 'content-type: application/json' \
            -H "x-cron-secret: ${CRON_SECRET}")
          echo "HTTP ${code}"
          cat response.json; echo
          [ "${code}" -ge 200 ] && [ "${code}" -lt 300 ]

  etsy-reconcile-status:
    if: contains(fromJSON('["all","reconcile-status"]'), inputs.job)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/admin/etsy/reconcile-status
        env:
          ROUTE: /api/admin/etsy/reconcile-status
          SECRET_NAME: ETSY_CRON_SECRET
          CRON_SECRET: ${{ secrets.ETSY_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::${SECRET_NAME} is not set in this repository's Actions secrets."
            exit 1
          fi
          code=$(curl -sS --max-time 120 -o response.json -w '%{http_code}' \
            -X POST "${SITE_URL}${ROUTE}" \
            -H 'content-type: application/json' \
            -H "x-cron-secret: ${CRON_SECRET}")
          echo "HTTP ${code}"
          cat response.json; echo
          [ "${code}" -ge 200 ] && [ "${code}" -lt 300 ]

  # Uses INSTAGRAM_CRON_SECRET, same as the drip — the refresh-token route is
  # guarded by that same variable.
  instagram-token-refresh:
    if: contains(fromJSON('["all","instagram-token-refresh"]'), inputs.job)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/admin/instagram/refresh-token
        env:
          ROUTE: /api/admin/instagram/refresh-token
          SECRET_NAME: INSTAGRAM_CRON_SECRET
          CRON_SECRET: ${{ secrets.INSTAGRAM_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::${SECRET_NAME} is not set in this repository's Actions secrets."
            exit 1
          fi
          code=$(curl -sS --max-time 120 -o response.json -w '%{http_code}' \
            -X POST "${SITE_URL}${ROUTE}" \
            -H 'content-type: application/json' \
            -H "x-cron-secret: ${CRON_SECRET}")
          echo "HTTP ${code}"
          cat response.json; echo
          [ "${code}" -ge 200 ] && [ "${code}" -lt 300 ]
