[build]
  base    = "next-app"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Legacy image URLs (assets moved to assets/images/)
[[redirects]]
  from = "/assets/branding/:splat"
  to = "/assets/images/branding/:splat"
  status = 301

[[redirects]]
  from = "/assets/pages/:splat"
  to = "/assets/images/pages/:splat"
  status = 301

