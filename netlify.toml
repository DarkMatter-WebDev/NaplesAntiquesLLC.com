[build]
  publish = "."
  functions = "netlify/functions"
  # Build-integrity guardrail: validates the product catalog, EN<->ES shop/page
  # parity, image existence, and root-absolute Spanish paths. Pure Node (no npm
  # install). A non-zero exit fails the deploy. See project-docs/INTEGRITY.md.
  command = "node tools/check-integrity.mjs"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "GET, OPTIONS"

